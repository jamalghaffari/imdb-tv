    /* استایل‌های ضدگلوله تلویزیون (سازگار ۱۰۰٪ با رزولوشن واقعی Android TV 540p/720p/1080p) */
    .tv-root-shell {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      height: calc(100vh - 76px);
      overflow: hidden;
      padding: 4px 12px;
      box-sizing: border-box;
    }
    .tv-main-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      padding-top: 4px;
    }
    .tv-poster-col {
      flex: 0 0 32%;
      max-width: 32%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 16px;
      box-sizing: border-box;
    }
    .tv-poster-card {
      position: relative;
      width: 185px;
      height: 270px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(245, 197, 24, 0.55);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9);
      background: #14161f;
      flex-shrink: 0;
    }
    .tv-info-col {
      flex: 1 1 68%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: right;
      padding-right: 16px;
      box-sizing: border-box;
    }
    .tv-btn-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
      flex-shrink: 0;
    }
    .tv-btn-row > button {
      margin-left: 8px;
      margin-bottom: 6px;
    }
    .tv-carousel-strip {
      display: flex;
      flex-direction: row;
      align-items: center;
      overflow-x: auto;
      justify-content: center;
      padding: 4px 2px;
      width: 100%;
    }
    .tv-carousel-item {
      flex: 0 0 68px;
      width: 68px;
      height: 98px;
      margin-left: 8px;
      border-radius: 8px;
      overflow: hidden;
      background: #14161f;
    }
    @media (min-width: 1280px) {
      .tv-poster-card {
        width: 290px;
        height: 425px;
      }
      .tv-carousel-item {
        flex: 0 0 100px;
        width: 100px;
        height: 146px;
      }
    }

<style>
/* نمای موزاییکی مستقل از Tailwind CDN/Purge */
    .mosaic-grid {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      padding: 8px 4px 40px;
    }
    @media (min-width: 640px) {
      .mosaic-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 768px) {
      .mosaic-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .mosaic-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
    .mosaic-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      text-align: right;
      background: transparent;
      border: 0;
      padding: 4px;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .mosaic-card:hover {
      transform: translateY(-4px);
    }
    .mosaic-card:focus,
    .mosaic-card:focus-visible {
      outline: 4px solid #F5C518 !important;
      outline-offset: 2px;
      transform: scale(1.04) !important;
      box-shadow: 0 0 28px rgba(245, 197, 24, 0.9) !important;
      z-index: 20;
    }
    .mosaic-poster-box {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      min-height: 180px;
      border-radius: 14px;
      overflow: hidden;
      background-color: #11131a;
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.65);
    }
</style>

r at Shaffer Conservatory of Music, the best music school in the United States. At Shaffer, being the best means being accepted to study under Terence Fletcher and being asked to play in his studio band, which represents the school at jazz competitions. Based on their less than positive first meeting, Andrew is surprised that Fletcher asks him to join the band, albeit in the alternate drummer position which he is more than happy to do initially. Andrew quickly learns that Fletcher operates on fear and intimidation, never settling for what he considers less than the best each and every time. Being the best in Fletcher's mind does not only entail playing well, but knowing that you're playing well and if not what you're doing wrong. His modus operandi creates an atmosphere of fear and of every man or woman for him/herself within the band. Regardless, Andrew works hard to be the best. He has to figure out his life priorities and what he is willing to sacrifice to be the best. The other question becomes how much emotional abuse he will endure by Fletcher to reach that greatness, which he may believe he can only achieve with the avenues opened up by Fletcher.",youtube:"https://www.youtube.com/watch?v=dprw54qdJJU"},{id:"mansoori_5",rank:null,episode:22,titleEn:"Bob Trevino Likes It",titleFa:"\u0628\u0627\u0628 \u062A\u0631\u0648\u06CC\u0646\u0648 \u062F\u0648\u0633\u062A\u0634 \u062F\u0627\u0631\u062F",year:2025,rating:7.4,director:"Tracie Laymon",stars:"Barbie Ferreira, John Leguizamo, French Stewart",genre:"Comedy, Drama",runtime:101,plot:"\u0644\u06CC\u0644\u06CC\u060C \u062F\u062E\u062A\u0631 \u062C\u0648\u0627\u0646\u06CC \u06A9\u0647 \u0627\u0632 \u0628\u06CC\u200C\u0645\u0647\u0631\u06CC \u0648 \u0628\u06CC\u200C\u062A\u0648\u062C\u0647\u06CC \u067E\u062F\u0631 \u062E\u0648\u062F\u062E\u0648\u0627\u0647\u0634 \u062E\u0633\u062A\u0647 \u0634\u062F\u0647\u060C \u062F\u0631 \u0641\u0636\u0627\u06CC \u0645\u062C\u0627\u0632\u06CC \u0627\u062A\u0641\u0627\u0642\u06CC \u0 m leader Saladin Ayubi. But Baldwin's days are numbered, and strains of fanaticism, greed, and jealousy among the Crusaders threaten to shatter the truce. King Baldwin's vision of peace--a kingdom of heaven--is shared by a handful of knights, including Godfrey of Ibelin, who swear to uphold it with their lives and honor. As Godfrey passes his sword to his son, he also passes on that sacred oath: to protect the helpless, safeguard the peace, and work toward harmony between religions and cultures, so that a kingdom of heaven can flourish on earth. Balian takes the sword and steps into history.",youtube:"https://www.youtube.com/watch?v=58P_oarHPig"},{id:"mansoori_10",rank:null,episode:21,titleEn:"Capernaum",titleFa:"\u06A9\u0641\u0631\u0646\u0627\u062D\u0648\u0645",year:2018,rating:8.4,director:"Nadine Labaki",stars:"Zain Al Rafeea, Yordanos Shifera, Boluwatife Treasure Bankole",genre:"Drama",runtime:126,plot:"\u0632\u06CC\u0646\u060C \u067E\u0633\u0631\u06A9 \u062F\u0648\u0627\u0632\u062F\u0647\u200C\u0633\u0627\u0644\u0647 \u0648 \u0628\u0627\u0647\u0648\u0634 \u0644\u0628\u0646\u0627\u0646\u06CC \u06A9\u0647 \u062F\u0631 \u0641\u0642\u0631 \u0645\u0637\u0644\u0642 \u0632\u0627\u063A\u0647\u200C\u0647\u0627 \u0642\u062F \u06A9\u0634\u06CC\u062F\u0647\u060C \u062A\u0635\u0645\u06CC\u0645 \u0645\u06CC\u200C\u06AF\u06CC\u0631\u062F \u062F\u0631 \u0627\u0642\u062F\u0627\u0645\u06CC \u0639\u062C\u06CC\u0628 \u0627\u0632 \u067E\u062F\u0631 \u0648 \u0645\u0627\u062F\u0631\u0634 \u0634\u06A9\u0627\u06CC\u062A \u06A9\u0646\u062F\u061B \u0622\u0646 \u0647\u0645 \u0628\u0647 \u062C\u0631\u0645 \u0627\u06CC\u0646\u06A9\u0647 \u0627\u0648 \u0631\u0627 \u0628\u0647 \u062F\u0646\u06CC\u0627 \u0622\u0648\u0631\u062F\u0647\u200C\u0627\u0646\u062F! \u0641\u06CC\u0644\u0645 \u0633\u0641\u0631\u06CC \u062A\u06A9\u0627\u0646\u200C\u062F\u0647\u0646\u062F\u0647 \u0648 \u062F\u0631\u062F\u0646\u0627\u06A9 \u0628\u0647 \u062F\u0644 \u0632\u0646\u062F\u06AF\u06CC \u06A9\u0648\u062F\u06A9\u06 n Arkansas with his parents, Mary Lee (Sarah Paulson) and Senior (Ray McKinnon). He sneaks out early one morning to meet his best friend, Neckbone (Jacob Lofland). Neckbone, also 14, lives with his uncle, Galen (Michael Shannon), who makes a hardscrabble living diving for oysters. The two boys set out to an island on the Mississippi River, where Neckbone has discovered an unusual sight-a boat, suspended high in the trees, a remnant of an extreme flood some time in the past. They climb the tree and into the boat only to find fresh bread and fresh footprints. Realizing that they are not the only ones who have discovered the treehouse boat, they decide to leave. When they reach the shore, they find the same footprint in their boat. And that's when they meet Mud (Matthew McConaughey). Mud is a gritty, superstitious character; his clothes are dirty, his tooth is cracked, and he needs help. He tells the boys he will give them the treehouse boat, his current hideout, in exchange for food. Neckbone is reluctant, but Ellis brings food to Mud, and they develop a tentative friendship. Ellis learns that Mud has killed a man in Texas, and police and bounty hunters are looking for him, but Mud is more concerned about reuniting with his longtime love, Juniper (Reese Witherspoon). Ellis, who has recently developed his own crush, agrees to help Mud escape with Juniper. Ellis and Neckbone carry out bold schemes in an effort to protect Mud and relay messages to Juniper, who is holed up in a fleabag motel, under constant surveillance by Carver (Paul Sparks), a Texas bounty hunter. Carver and his gang are intent on capturing Mud, on orders from the cold-blooded King (Joe Don Baker). As the boys risk everything to reunite these seeming mythical lovers, Ellis's own ideas about love and romance are challenged by the strains in the relationships closest to him: his parents' marriage is dissolving while he himself falters in his efforts to impress May Pearl (Bonnie Sturdivant). Through it al e decision to live this lifestyle for Leslie's health. Formerly an attorney, Leslie was diagnosed as bipolar. Ben believes that this disorder started with her postpartum depression with Bo. Yet Leslie's condition has worsened. Despite not believing in Western medicine, Ben sends Leslie to a hospital close to Ben's sister, Harper, so that there can be family close by. While hospitalized, Leslie commits suicide. Beyond the collective grief, Leslie's act brings out a battle between Ben and Leslie's father, Jack Bertrang, a Christian who not only blames Ben for Leslie's death, but believes that what he is doing "to" the children can legally be considered abuse. Jack takes over the funeral arrangements as per his and his complacent wife Abby's Christian morals, against what Ben knows was Leslie's wishes, as she believed in Buddhist philosophies. Although Jack threatens to call the police if Ben shows up to the funeral, Ben and the children believe it is their mission to honor Leslie's last wishes to be cremated as per Buddhist philosophy. This mission not only may bring the divide between Jack and Ben to a head, but may also bring out some long dormant issues between the Cash children as they are exposed to commercial America in all its good and bad, and as Bo grows into manhood, he may have his own ideas of what he should do with the next phase of his life.`,youtube:"https://www.youtube.com/watch?v=LqEgkxMoNjk"},{id:"mansoori_71",rank:61,episode:null,titleEn:"The Menu",titleFa:"\u0635\u0648\u0631\u062A\u200C\u063A\u0630\u0627 (\u0645\u0646\u0648)",year:2022,rating:7.1,director:"Mark Mylod",stars:"Ralph Fiennes, Anya Taylor-Joy, Nicholas Hoult",genre:"Comedy, Horror, Thriller",runtime:107,plot:"\u06CC\u06A9 \u0632\u0648\u062C \u062C\u0648\u0627\u0646 \u0647\u0645\u0631\u0627\u0647 \u0686\u0646\u062F \u062B\u0631\u0648\u062A\u0645\u0646\u062F \u0627\u0641\u0627\u062F\u0647\u200C\u0627\u06CC \u0631\u0627\u0647\u06CC \u062C\u0632\u06CC\u0631\u0647\u200C\u0627\u06CC \u062F\u
